# Barri-Eww CI
#
# Gate for every MR into `dev` and `master` (spec §4.3 / §5.4).
# Runs the three module pipelines (Native / Mod / Editor) across the build
# variant matrix (spec §3, §4.4) and enforces coverage gates (spec §4.5).
#
# NOTE: while a module is still empty scaffolding, its job auto-detects the
# absence of build files and skips its build/test steps (staying green), so the
# pipeline lights up progressively as each module is implemented.

name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Native (C++23 / CMake 4.4 / Vulkan) ─────────────────────────────
  native:
    name: Native (${{ matrix.os }}, THREADED_RECORDING=${{ matrix.threadedRecording }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        threadedRecording: [ON, OFF]
    steps:
      - uses: actions/checkout@v4

      - name: Detect module readiness
        id: detect
        shell: bash
        run: |
          if grep -q "project(" Native/CMakeLists.txt 2>/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Native/ is still empty scaffolding — skipping build/test."
          fi

      - name: Install CMake 4.4
        if: steps.detect.outputs.ready == 'true'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.4"

      - name: Install and verify Vulkan software implementation (lavapipe, Linux)
        if: steps.detect.outputs.ready == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-tools
          lavapipeManifest="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          if [ -z "$lavapipeManifest" ]; then
            echo "No lavapipe ICD manifest found under /usr/share/vulkan/icd.d" >&2
            ls -la /usr/share/vulkan/icd.d >&2
            exit 1
          fi
          echo "VK_DRIVER_FILES=$lavapipeManifest" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$lavapipeManifest" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$lavapipeManifest" VK_ICD_FILENAMES="$lavapipeManifest" \
            vulkaninfo --summary

      # Windows runners have no Vulkan SDK/driver, so the Vulkan backend builds on Linux
      # only (lavapipe executes the GPU tests there); Windows still covers the
      # backend-neutral format layer across the THREADED_RECORDING variants. Software
      # rasterization on Windows is deliberately not built from source in CI — it would
      # cost a full SwiftShader compile per run for coverage lavapipe already provides.
      - name: Configure
        if: steps.detect.outputs.ready == 'true'
        run: >
          cmake -S Native -B Native/build
          -DCMAKE_BUILD_TYPE=Release
          -DTHREADED_RECORDING=${{ matrix.threadedRecording }}
          -DBARRIEWW_BACKEND_VULKAN=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}

      - name: Build
        if: steps.detect.outputs.ready == 'true'
        run: cmake --build Native/build --config Release

      - name: Test (Catch2 via CTest)
        if: steps.detect.outputs.ready == 'true'
        run: ctest --test-dir Native/build -C Release --output-on-failure

      - name: Set up JDK 25 for Core FFM integration
        if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "25"

      - name: Test Core Java-to-Native FFM integration and coverage
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            nativeLibraryPath="$(cygpath -m "$PWD/Native/build/ffm/BarriEwwNativeFfm.dll")"
          else
            nativeLibraryPath="$PWD/Native/build/ffm/libBarriEwwNativeFfm.so"
          fi
          test -f "$nativeLibraryPath"
          # The presentation runtime FFM symbols exist only in Vulkan-enabled builds, so the
          # demoTest binding suite runs on the Linux (Vulkan) cells, not Windows backend-neutral.
          demoTestTask=""
          if [ "$RUNNER_OS" = "Linux" ]; then
            demoTestTask="demoTest"
          fi
          ./Core/gradlew -p Core clean test nativeIntegrationTest $demoTestTask \
            jacocoTestReport jacocoTestCoverageVerification \
            -PbarriewwNativeLibraryPath="$nativeLibraryPath" --no-daemon

  native-coverage:
    name: Native coverage (Linux, Vulkan, THREADED_RECORDING=ON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake 4.4
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.4"

      - name: Install coverage and Vulkan software implementation
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr libvulkan-dev mesa-vulkan-drivers vulkan-tools
          lavapipeManifest="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          if [ -z "$lavapipeManifest" ]; then
            echo "No lavapipe ICD manifest found under /usr/share/vulkan/icd.d" >&2
            exit 1
          fi
          echo "VK_DRIVER_FILES=$lavapipeManifest" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$lavapipeManifest" >> "$GITHUB_ENV"

      - name: Configure coverage build
        run: >
          cmake -S Native -B Native/build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DTHREADED_RECORDING=ON
          -DBARRIEWW_BACKEND_VULKAN=ON
          -DBARRIEWW_ENABLE_COVERAGE=ON

      - name: Build and test coverage variant
        run: |
          cmake --build Native/build-coverage --config Debug
          ctest --test-dir Native/build-coverage -C Debug --output-on-failure

      - name: Enforce Native line coverage
        working-directory: Native
        run: >
          gcovr --root .
          --filter 'src/'
          --filter 'include/'
          --exclude 'build-coverage/'
          --fail-under-line 90
          --print-summary
          build-coverage

  # ── Core (Java SE 25 / Gradle) — RDG compiler + BECS writer + FFM ──
  core:
    name: Core (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect module readiness
        id: detect
        shell: bash
        run: |
          if [ -f Core/settings.gradle.kts ] || [ -f Core/settings.gradle ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Core/ is still empty scaffolding — skipping build/test."
          fi

      - name: Set up JDK 25 (Microsoft OpenJDK)
        if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "25"

      - name: Build & test (JUnit 5)
        if: steps.detect.outputs.ready == 'true'
        working-directory: Core
        run: ./gradlew build test --no-daemon

      # The Java >=90% gate merges unit and real FFM integration execution data in every
      # Native matrix cell, where the exact platform shared library is available.

  # ── Mod (Java SE 25 / Gradle) — thin game-side loader ──────────────
  mod:
    name: Mod (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect module readiness
        id: detect
        shell: bash
        run: |
          if [ -f Mod/settings.gradle ] || [ -f Mod/settings.gradle.kts ] || [ -f Mod/build.gradle ] || [ -f Mod/build.gradle.kts ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Mod/ is still empty scaffolding — skipping build/test."
          fi

      - name: Set up JDK 25 (Microsoft OpenJDK)
        if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "25"

      - name: Build & test (JUnit 5 + JaCoCo)
        if: steps.detect.outputs.ready == 'true'
        working-directory: Mod
        run: ./gradlew build test jacocoTestReport --no-daemon

      # Coverage gate (spec §4.5): Java >= 90%. Enforce via
      # jacocoTestCoverageVerification once tests exist.

  # ── Editor (TypeScript / Node / Electron) ───────────────────────────
  editor:
    name: Editor (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect module readiness
        id: detect
        shell: bash
        run: |
          if [ -f Editor/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Editor/ is still empty scaffolding — skipping build/test."
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Editor/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.ready == 'true'
        working-directory: Editor
        run: npm ci

      - name: Type check (tsc --noEmit)
        if: steps.detect.outputs.ready == 'true'
        working-directory: Editor
        run: npx tsc --noEmit

      - name: Lint (ESLint) & format check (Prettier)
        if: steps.detect.outputs.ready == 'true'
        working-directory: Editor
        run: |
          npx eslint .
          npx prettier --check .

      - name: Unit tests (Vitest + coverage)
        if: steps.detect.outputs.ready == 'true'
        working-directory: Editor
        run: npx vitest run --coverage

      # Coverage gate (spec §4.5): TypeScript >= 70%. Configure Vitest
      # coverage.thresholds once tests exist.
