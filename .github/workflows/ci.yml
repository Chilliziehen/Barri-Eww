# Barri-Eww CI
#
# Gate for every MR into `dev` and `master` (spec §4.3 / §5.4).
# Runs the three module pipelines (Native / Mod / Editor) across the build
# variant matrix (spec §3, §4.4) and enforces coverage gates (spec §4.5).
#
# NOTE: while a module is still empty scaffolding, its job auto-detects the
# absence of build files and skips its build/test steps (staying green), so the
# pipeline lights up progressively as each module is implemented.

name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Native (C++23 / CMake 4.4 / Vulkan) ─────────────────────────────
  native:
    name: Native (${{ matrix.os }}, THREADED_RECORDING=${{ matrix.threadedRecording }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        threadedRecording: [ON, OFF]
    steps:
      - uses: actions/checkout@v4

      - name: Detect module readiness
        id: detect
        shell: bash
        run: |
          if grep -q "project(" Native/CMakeLists.txt 2>/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Native/ is still empty scaffolding — skipping build/test."
          fi

      - name: Install CMake 4.4
        if: steps.detect.outputs.ready == 'true'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.4"

      - name: Install and verify Vulkan software implementation (lavapipe, Linux)
        if: steps.detect.outputs.ready == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-tools
          lavapipeManifest="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          if [ -z "$lavapipeManifest" ]; then
            echo "No lavapipe ICD manifest found under /usr/share/vulkan/icd.d" >&2
            ls -la /usr/share/vulkan/icd.d >&2
            exit 1
          fi
          echo "VK_DRIVER_FILES=$lavapipeManifest" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$lavapipeManifest" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$lavapipeManifest" VK_ICD_FILENAMES="$lavapipeManifest" \
            vulkaninfo --summary

      - name: Install Vulkan SDK (Windows)
        if: steps.detect.outputs.ready == 'true' && runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Build SwiftShader Vulkan software implementation (Windows)
        if: steps.detect.outputs.ready == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/google/swiftshader.git Native/swiftshader-source
          git -C Native/swiftshader-source checkout a7c547b55474c3d8bde53711eae24ae0e28bbc0a
          cmake -S Native/swiftshader-source -B Native/swiftshader-build `
            -DSWIFTSHADER_BUILD_TESTS=OFF `
            -DSWIFTSHADER_BUILD_BENCHMARKS=OFF
          cmake --build Native/swiftshader-build --config Release `
            --target vk_swiftshader --parallel
          $imageConfigurationFile = Get-ChildItem Native/swiftshader-build `
            -Filter vk_swiftshader_icd.json -Recurse | Select-Object -First 1
          if ($null -eq $imageConfigurationFile) {
            throw "SwiftShader build did not produce vk_swiftshader_icd.json"
          }
          "VK_ICD_FILENAMES=$($imageConfigurationFile.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        if: steps.detect.outputs.ready == 'true'
        run: >
          cmake -S Native -B Native/build
          -DCMAKE_BUILD_TYPE=Release
          -DTHREADED_RECORDING=${{ matrix.threadedRecording }}
          -DBARRIEWW_BACKEND_VULKAN=ON

      - name: Build
        if: steps.detect.outputs.ready == 'true'
        run: cmake --build Native/build --config Release

      - name: Test (Catch2 via CTest)
        if: steps.detect.outputs.ready == 'true'
        run: ctest --test-dir Native/build -C Release --output-on-failure

      # Coverage gate (spec §4.5): C++ >= 90%. Wire gcovr/llvm-cov threshold
      # once tests exist.

  # ── Core (Java SE 25 / Gradle) — RDG compiler + BECS writer + FFM ──
  core:
    name: Core (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect module readiness
        id: detect
        shell: bash
        run: |
          if [ -f Core/settings.gradle.kts ] || [ -f Core/settings.gradle ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Core/ is still empty scaffolding — skipping build/test."
          fi

      - name: Set up JDK 25 (Microsoft OpenJDK)
        if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "25"

      - name: Build & test (JUnit 5 + JaCoCo)
        if: steps.detect.outputs.ready == 'true'
        working-directory: Core
        run: ./gradlew build test jacocoTestReport --no-daemon

      # Coverage gate (spec §4.5): Java >= 90%. Enforce via
      # jacocoTestCoverageVerification once the module grows beyond scaffolding.

  # ── Mod (Java SE 25 / Gradle) — thin game-side loader ──────────────
  mod:
    name: Mod (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect module readiness
        id: detect
        shell: bash
        run: |
          if [ -f Mod/settings.gradle ] || [ -f Mod/settings.gradle.kts ] || [ -f Mod/build.gradle ] || [ -f Mod/build.gradle.kts ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Mod/ is still empty scaffolding — skipping build/test."
          fi

      - name: Set up JDK 25 (Microsoft OpenJDK)
        if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "25"

      - name: Build & test (JUnit 5 + JaCoCo)
        if: steps.detect.outputs.ready == 'true'
        working-directory: Mod
        run: ./gradlew build test jacocoTestReport --no-daemon

      # Coverage gate (spec §4.5): Java >= 90%. Enforce via
      # jacocoTestCoverageVerification once tests exist.

  # ── Editor (TypeScript / Node / Electron) ───────────────────────────
  editor:
    name: Editor (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect module readiness
        id: detect
        shell: bash
        run: |
          if [ -f Editor/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Editor/ is still empty scaffolding — skipping build/test."
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Editor/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.ready == 'true'
        working-directory: Editor
        run: npm ci

      - name: Type check (tsc --noEmit)
        if: steps.detect.outputs.ready == 'true'
        working-directory: Editor
        run: npx tsc --noEmit

      - name: Lint (ESLint) & format check (Prettier)
        if: steps.detect.outputs.ready == 'true'
        working-directory: Editor
        run: |
          npx eslint .
          npx prettier --check .

      - name: Unit tests (Vitest + coverage)
        if: steps.detect.outputs.ready == 'true'
        working-directory: Editor
        run: npx vitest run --coverage

      # Coverage gate (spec §4.5): TypeScript >= 70%. Configure Vitest
      # coverage.thresholds once tests exist.
